<section class="panel" id="engineerPanel" style="display: none;">
  <!-- Login Section -->
  <div id="engineerLoginSection">
    <h2>🔐 Engineer Login</h2>
    <div class="form-section">
      <div class="form-group">
        <label for="loginEngineerName">Select Your Name</label>
        <select id="loginEngineerName">
          <option value="" disabled selected>-- select your name --</option>
        </select>
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button class="btn" id="loginBtn">Login</button>
        <button class="btn btn-secondary" id="changePasswordBtn">Change Password</button>
      </div>
    </div>
  </div>

  <!-- Main Engineer Interface (Hidden until login) -->
  <div id="engineerMainInterface" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h2>🧑‍💻 Daily Report - <span id="loggedInEngineerName"></span></h2>
      <div style="display: flex; gap: 10px; align-items: center;">
        <div class="form-group" style="margin: 0;">
          <label for="reportDate">Report Date</label>
          <input type="date" id="reportDate" style="width: 150px;">
        </div>
        <button class="btn btn-secondary" id="logoutBtn">Logout</button>
      </div>
    </div>

    <!-- Assigned Projects Section -->
    <div class="form-section" id="assignedProjectsSection">
      <div class="section-title">📋 Your Assigned Projects</div>
      <div id="assignedProjectsContainer">
        <!-- Assigned projects will be populated here -->
      </div>
    </div>

    <!-- Tasks Container -->
    <div id="tasksContainer"></div>

    <!-- Custom Tasks Section -->
    <div class="form-section">
      <div class="section-title">➕ Custom Tasks</div>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <button class="btn" id="addCustomTaskBtn">+ Add Custom Task</button>
        <button class="btn btn-success" id="submitAllBtn">Submit All Tasks</button>
      </div>
    </div>

    <!-- Progress Bar -->
    <div style="margin-top:14px;">
      <label>Daily timeline progress (target 8 hours)</label>
      <div style="height:10px;width:100%;background:var(--glass);border-radius:6px;overflow:hidden;">
        <div id="progressBar" style="height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition: width 0.5s ease;"></div>
      </div>
      <div id="progressText" style="text-align:right;font-size:12px;color:var(--muted);">0h / 8h</div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div id="changePasswordModal" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <div class="modal-title">🔑 Change Password</div>
        <button class="close-btn" onclick="document.getElementById('changePasswordModal').style.display = 'none'">×</button>
      </div>
      <div class="form-section">
        <div class="form-group">
          <label for="currentPassword">Current Password</label>
          <input type="password" id="currentPassword">
        </div>
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button class="btn btn-secondary" onclick="document.getElementById('changePasswordModal').style.display = 'none'">Cancel</button>
          <button class="btn" id="savePasswordBtn">Save Password</button>
        </div>
      </div>
    </div>
  </div>
</section>
