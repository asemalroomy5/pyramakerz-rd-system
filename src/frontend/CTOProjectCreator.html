<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #ff6a00;
      --primary-dark: #e55e00;
      --bg: #f8f9fa;
      --card: #ffffff;
      --text: #333333;
      --border: #dee2e6;
      --success: #28a745;
      --glass: rgba(255,255,255,0.03);
      --input-bg: #ffffff;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      line-height: 1.6;
    }
    
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    .header {
      background: linear-gradient(135deg, var(--primary), #ff8c42);
      color: white;
      padding: 25px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    
    .header p {
      opacity: 0.9;
      font-size: 14px;
    }
    
    .content {
      padding: 25px;
      max-height: 70vh;
      overflow-y: auto;
    }
    
    .form-section {
      margin-bottom: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    
    .section-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    
    input[type="text"],
    select,
    textarea,
    input[type="date"] {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    
    input[type="text"]:focus,
    select:focus,
    textarea:focus,
    input[type="date"]:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: white;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    
    .checkbox-item input[type="checkbox"] {
      transform: scale(1.2);
    }

    .engineers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 12px;
      margin-top: 10px;
      max-height: 300px;
      overflow-y: auto;
      padding: 10px;
    }

    .engineer-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 2px solid var(--border);
      transition: all 0.3s;
      cursor: pointer;
    }
    
    .engineer-card:hover {
      border-color: var(--primary);
      background: #fff8f0;
    }
    
    .engineer-card.selected {
      border-color: var(--primary);
      background: #fff0e6;
    }
    
    .engineer-name {
      font-weight: 600;
      margin-bottom: 4px;
    }
    
    .engineer-role {
      font-size: 12px;
      color: #666;
    }

    .notifications-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .notification-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: var(--glass);
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .notification-item input {
      transform: scale(1.2);
    }

    .task-item {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border: 1px solid var(--border);
    }

    .task-item input,
    .task-item select,
    .task-item textarea {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      color: var(--text);
      width: 100%;
    }

    .task-item textarea {
      resize: vertical;
      min-height: 60px;
    }
    
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .task-number {
      background: var(--primary);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn:hover {
      background: var(--primary-dark);
    }
    
    .btn-secondary {
      background: #6c757d;
    }
    
    .btn-secondary:hover {
      background: #5a6268;
    }
    
    .btn-success {
      background: var(--success);
    }
    
    .btn-success:hover {
      background: #218838;
    }
    
    .btn-danger {
      background: #dc3545;
      padding: 8px 12px;
      font-size: 12px;
    }
    
    .btn-danger:hover {
      background: #c82333;
    }
    
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }
    
    .notification-section {
      background: #e7f3ff;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #b3d9ff;
    }
    
    .preview-box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
    }
    
    .preview-item {
      margin: 8px 0;
      padding: 8px;
      background: white;
      border-radius: 4px;
    }
    
    .auto-tasks {
      background: #f0f8f0;
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
    }
    
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin: 15px 0;
    }
    
    .quick-btn {
      background: white;
      border: 2px solid var(--primary);
      color: var(--primary);
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      transition: all 0.3s;
    }
    
    .quick-btn:hover {
      background: var(--primary);
      color: white;
    }

    .task-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .add-task-btn {
      background: var(--success);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .remove-task-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }

    /* Trello-like status styles */
    .trello-status {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }

    .status-option {
      padding: 8px 12px;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s;
    }

    .status-option.selected {
      border-color: currentColor;
      font-weight: bold;
    }

    .status-todo { background: #e3f2fd; color: #1976d2; }
    .status-inprogress { background: #fff3e0; color: #f57c00; }
    .status-review { background: #f3e5f5; color: #7b1fa2; }
    .status-blocked { background: #ffebee; color: #d32f2f; }
    .status-done { background: #e8f5e8; color: #388e3c; }

    /* Attachment styles */
    .attachment-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .attachment-btn {
      background: #f8f9fa;
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.3s;
    }

    .attachment-btn:hover {
      background: var(--primary);
      color: white;
    }

    .attachments-list {
      margin-top: 8px;
    }

    .attachment-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      background: #f8f9fa;
      border-radius: 4px;
      margin: 4px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 CTO Project Creator</h1>
      <p>Create complete projects with deadlines and custom tasks</p>
    </div>
    
    <div class="content">
      <!-- Quick Project Templates -->
      <div class="form-section">
        <div class="section-title">⚡ Quick Start Templates</div>
        <div class="quick-actions">
          <div class="quick-btn" onclick="loadTemplate('rc-car')">🚗 RC Car</div>
          <div class="quick-btn" onclick="loadTemplate('ai-bot')">🤖 AI Bot</div>
          <div class="quick-btn" onclick="loadTemplate('mech-kit')">⚙️ Mech Kit</div>
          <div class="quick-btn" onclick="loadTemplate('smart-home')">🏠 Smart Home</div>
        </div>
      </div>
      
      <!-- Project Details -->
      <div class="form-section">
        <div class="section-title">📋 Project Details</div>
        <div class="form-group">
          <label for="projectName">Project Name *</label>
          <input type="text" id="projectName" placeholder="e.g., Autonomous RC Car with AI Navigation">
        </div>
        
        <div class="form-group">
          <label for="projectDescription">Project Description</label>
          <textarea id="projectDescription" rows="3" placeholder="Brief description of the project..."></textarea>
        </div>

        <div class="form-group">
          <label for="projectDeadline">Project Deadline *</label>
          <input type="date" id="projectDeadline" required>
        </div>
      </div>
      
      <!-- Departments Selection -->
      <div class="form-section">
        <div class="section-title">🏢 Departments</div>
        <div class="checkbox-group" id="departmentsContainer">
          <!-- Departments will be populated here -->
        </div>
      </div>
      
      <!-- Engineers Selection -->
      <div class="form-section">
        <div class="section-title">👥 Assign Engineers</div>
        <div class="engineers-grid" id="engineersContainer">
          <!-- Engineers will be populated here -->
        </div>
      </div>
      
      <!-- Custom Tasks -->
      <div class="form-section">
        <div class="section-title">📝 Custom Tasks</div>
        <div id="tasksContainer">
          <div class="task-item">
            <div class="task-header">
              <div class="task-number">Task 1</div>
            </div>
            <div class="form-group">
              <label>Task Name *</label>
              <input type="text" class="task-name" placeholder="e.g., Design PCB Layout">
            </div>
            <div class="form-group">
              <label>Task Description</label>
              <textarea class="task-description" rows="2" placeholder="Task description..."></textarea>
            </div>
            <div class="form-group">
              <label>Department</label>
              <select class="task-department">
                <option value="">Select Department</option>
              </select>
            </div>
            <div class="form-group">
              <label>Task Deadline</label>
              <input type="date" class="task-deadline">
            </div>
            <!-- Trello-like Status -->
            <div class="form-group">
              <label>Status</label>
              <div class="trello-status">
                <div class="status-option status-todo" data-status="todo">📋 To Do</div>
                <div class="status-option status-inprogress" data-status="inprogress">🔄 In Progress</div>
                <div class="status-option status-review" data-status="review">👀 Review</div>
                <div class="status-option status-blocked" data-status="blocked">🚫 Blocked</div>
                <div class="status-option status-done" data-status="done">✅ Done</div>
              </div>
              <input type="hidden" class="task-status" value="todo">
            </div>
            <!-- Attachments -->
            <div class="form-group">
              <label>Attachments</label>
              <div class="attachment-buttons">
                <button type="button" class="attachment-btn" data-type="screenshot">📸 Screenshot</button>
                <button type="button" class="attachment-btn" data-type="video">🎥 Video</button>
                <button type="button" class="attachment-btn" data-type="document">📄 Document</button>
              </div>
              <div class="attachments-list"></div>
            </div>
          </div>
        </div>
        <button class="add-task-btn" id="addTaskBtn">+ Add Another Task</button>
      </div>
      
      <!-- Notifications -->
      <div class="form-section">
        <div class="section-title">🔔 Notifications</div>
        <div class="notification-section">
          <div class="form-group">
            <label>Email Notifications To:</label>
            <div class="checkbox-group">
              <label class="checkbox-item">
                <input type="checkbox" id="notifyCTO" checked>
                <span>CTO (nemr@pyramakerz.com)</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" id="notifyManagers" checked>
                <span>Department Managers</span>
              </label>
              <label class="checkbox-item">
                <input type="checkbox" id="notifyEngineers" checked>
                <span>Assigned Engineers</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Preview -->
      <div class="preview-box" id="previewBox">
        <div class="section-title">👁️ Preview</div>
        <div id="previewContent"></div>
      </div>
      
      <!-- Action Buttons -->
      <div class="buttons">
        <button class="btn btn-secondary" id="cancelBtn">❌ Cancel</button>
        <button class="btn" id="previewBtn">👁️ Preview Project</button>
        <button class="btn btn-success" id="createBtn">🚀 Create Project</button>
      </div>
    </div>
  </div>

  <script>
    let departments = [];
    let engineers = [];
    let selectedDepartments = new Set();
    let selectedEngineers = new Set();
    let taskCounter = 1;
    
    // Initialize the form
    document.addEventListener('DOMContentLoaded', function() {
      console.log("CTO Project Creator initializing...");
      loadFormData();
      
      // Set default deadline to 30 days from now
      const defaultDeadline = new Date();
      defaultDeadline.setDate(defaultDeadline.getDate() + 30);
      document.getElementById('projectDeadline').value = defaultDeadline.toISOString().split('T')[0];
      
      // Set up event listeners
      setupEventListeners();
      
      // Set default status for first task
      const firstStatusOption = document.querySelector('.status-option[data-status="todo"]');
      if (firstStatusOption) {
        selectStatus(firstStatusOption);
      }
    });
    
    function setupEventListeners() {
      // Add task button
      const addTaskBtn = document.getElementById('addTaskBtn');
      if (addTaskBtn) {
        addTaskBtn.addEventListener('click', addTask);
      }
      
      // Cancel button
      const cancelBtn = document.getElementById('cancelBtn');
      if (cancelBtn) {
        cancelBtn.addEventListener('click', function() {
          google.script.host.close();
        });
      }
      
      // Preview button
      const previewBtn = document.getElementById('previewBtn');
      if (previewBtn) {
        previewBtn.addEventListener('click', previewProject);
      }
      
      // Create button
      const createBtn = document.getElementById('createBtn');
      if (createBtn) {
        createBtn.addEventListener('click', createProject);
      }
      
      // Quick action buttons are set up via onclick in HTML
    }
    
    function loadFormData() {
      // Load departments
      google.script.run
        .withSuccessHandler(function(depts) {
          departments = depts;
          renderDepartments();
          updateTaskDepartmentOptions();
        })
        .withFailureHandler(function(error) {
          console.error('Error loading departments:', error);
          alert('Error loading departments: ' + error);
        })
        .getAvailableDepartments();
      
      // Load engineers
      google.script.run
        .withSuccessHandler(function(engs) {
          engineers = engs;
          renderEngineers();
        })
        .withFailureHandler(function(error) {
          console.error('Error loading engineers:', error);
          alert('Error loading engineers: ' + error);
        })
        .getAllEngineersWithDetails();
    }
    
    function renderDepartments() {
      const container = document.getElementById('departmentsContainer');
      if (!container) return;
      
      container.innerHTML = '';
      
      departments.forEach(dept => {
        const div = document.createElement('label');
        div.className = 'checkbox-item';
        div.innerHTML = `
          <input type="checkbox" value="${dept}">
          <span>${dept}</span>
        `;
        
        // Add event listener for department toggle
        const checkbox = div.querySelector('input');
        checkbox.addEventListener('change', function() {
          toggleDepartment(dept, this.checked);
        });
        
        container.appendChild(div);
      });
    }

    function updateTaskDepartmentOptions() {
      const departmentSelects = document.querySelectorAll('.task-department');
      departmentSelects.forEach(select => {
        select.innerHTML = '<option value="">Select Department</option>';
        departments.forEach(dept => {
          const option = document.createElement('option');
          option.value = dept;
          option.textContent = dept;
          select.appendChild(option);
        });
      });
    }
    
    function renderEngineers() {
      const container = document.getElementById('engineersContainer');
      if (!container) return;
      
      container.innerHTML = '';
      
      engineers.forEach(engineer => {
        const card = document.createElement('div');
        card.className = 'engineer-card';
        card.innerHTML = `
          <div class="engineer-name">${engineer.name}</div>
          <div class="engineer-role">${engineer.role} • ${engineer.department}</div>
        `;
        
        // Add click event for engineer selection
        card.addEventListener('click', function() {
          toggleEngineer(engineer.id, card);
        });
        
        container.appendChild(card);
      });
    }
    
    function toggleDepartment(dept, isChecked) {
      if (isChecked) {
        selectedDepartments.add(dept);
      } else {
        selectedDepartments.delete(dept);
      }
    }
    
    function toggleEngineer(engineerId, element) {
      if (selectedEngineers.has(engineerId)) {
        selectedEngineers.delete(engineerId);
        element.classList.remove('selected');
      } else {
        selectedEngineers.add(engineerId);
        element.classList.add('selected');
      }
    }
    
    function selectStatus(element) {
      if (!element) return;
      
      // Remove selected class from all status options in this task
      const statusOptions = element.parentElement.querySelectorAll('.status-option');
      statusOptions.forEach(opt => opt.classList.remove('selected'));
      
      // Add selected class to clicked option
      element.classList.add('selected');
      
      // Update the hidden input value
      const statusInput = element.closest('.form-group').querySelector('.task-status');
      if (statusInput) {
        statusInput.value = element.getAttribute('data-status');
      }
    }
    
    function setupTaskEventListeners(taskItem) {
      // Status options
      const statusOptions = taskItem.querySelectorAll('.status-option');
      statusOptions.forEach(option => {
        option.addEventListener('click', function() {
          selectStatus(this);
        });
      });
      
      // Attachment buttons
      const attachmentBtns = taskItem.querySelectorAll('.attachment-btn');
      attachmentBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          const type = this.getAttribute('data-type');
          uploadAttachment(this, type);
        });
      });
      
      // Remove task button
      const removeBtn = taskItem.querySelector('.remove-task-btn');
      if (removeBtn) {
        removeBtn.addEventListener('click', function() {
          removeTask(this);
        });
      }
    }
    
    function uploadAttachment(button, type) {
      const taskItem = button.closest('.task-item');
      const attachmentsList = taskItem.querySelector('.attachments-list');
      
      // Create file input
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = getAcceptType(type);
      fileInput.style.display = 'none';
      
      fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          addAttachmentToList(file, attachmentsList, type);
        }
      });
      
      document.body.appendChild(fileInput);
      fileInput.click();
      document.body.removeChild(fileInput);
    }
    
    function getAcceptType(type) {
      switch(type) {
        case 'screenshot': return 'image/*';
        case 'video': return 'video/*';
        case 'document': return '.pdf,.doc,.docx,.txt';
        default: return '*/*';
      }
    }
    
    function addAttachmentToList(file, attachmentsList, type) {
      const attachmentItem = document.createElement('div');
      attachmentItem.className = 'attachment-item';
      attachmentItem.innerHTML = `
        <span>${getAttachmentIcon(type)} ${file.name}</span>
        <button type="button" style="background:none; border:none; color:red; cursor:pointer;">×</button>
      `;
      
      // Add remove event listener
      const removeBtn = attachmentItem.querySelector('button');
      removeBtn.addEventListener('click', function() {
        removeAttachment(this);
      });
      
      attachmentsList.appendChild(attachmentItem);
    }
    
    function getAttachmentIcon(type) {
      switch(type) {
        case 'screenshot': return '📸';
        case 'video': return '🎥';
        case 'document': return '📄';
        default: return '📎';
      }
    }
    
    function removeAttachment(button) {
      const attachmentItem = button.closest('.attachment-item');
      if (attachmentItem) {
        attachmentItem.remove();
      }
    }
    
    function addTask() {
      taskCounter++;
      const tasksContainer = document.getElementById('tasksContainer');
      if (!tasksContainer) return;
      
      const taskItem = document.createElement('div');
      taskItem.className = 'task-item';
      taskItem.innerHTML = `
        <div class="task-header">
          <div class="task-number">Task ${taskCounter}</div>
          <button class="remove-task-btn">Remove</button>
        </div>
        <div class="form-group">
          <label>Task Name *</label>
          <input type="text" class="task-name" placeholder="e.g., Design PCB Layout">
        </div>
        <div class="form-group">
          <label>Task Description</label>
          <textarea class="task-description" rows="2" placeholder="Task description..."></textarea>
        </div>
        <div class="form-group">
          <label>Department</label>
          <select class="task-department">
            <option value="">Select Department</option>
          </select>
        </div>
        <div class="form-group">
          <label>Task Deadline</label>
          <input type="date" class="task-deadline">
        </div>
        <div class="form-group">
          <label>Status</label>
          <div class="trello-status">
            <div class="status-option status-todo" data-status="todo">📋 To Do</div>
            <div class="status-option status-inprogress" data-status="inprogress">🔄 In Progress</div>
            <div class="status-option status-review" data-status="review">👀 Review</div>
            <div class="status-option status-blocked" data-status="blocked">🚫 Blocked</div>
            <div class="status-option status-done" data-status="done">✅ Done</div>
          </div>
          <input type="hidden" class="task-status" value="todo">
        </div>
        <div class="form-group">
          <label>Attachments</label>
          <div class="attachment-buttons">
            <button type="button" class="attachment-btn" data-type="screenshot">📸 Screenshot</button>
            <button type="button" class="attachment-btn" data-type="video">🎥 Video</button>
            <button type="button" class="attachment-btn" data-type="document">📄 Document</button>
          </div>
          <div class="attachments-list"></div>
        </div>
      `;
      
      tasksContainer.appendChild(taskItem);
      updateTaskDepartmentOptions();
      setupTaskEventListeners(taskItem);
      
      // Set default status for new task
      const newStatusOption = taskItem.querySelector('.status-option[data-status="todo"]');
      if (newStatusOption) {
        selectStatus(newStatusOption);
      }
    }

    function removeTask(button) {
      if (taskCounter > 1) {
        const taskItem = button.closest('.task-item');
        if (taskItem) {
          taskItem.remove();
          taskCounter--;
          
          // Renumber remaining tasks
          const tasks = document.querySelectorAll('.task-item');
          tasks.forEach((task, index) => {
            const taskNumber = task.querySelector('.task-number');
            if (taskNumber) {
              taskNumber.textContent = `Task ${index + 1}`;
            }
          });
        }
      } else {
        alert('You must have at least one task!');
      }
    }

      const templates = {
        'rc-car': {
          name: 'Autonomous RC Car',
          description: 'AI-powered RC car with obstacle avoidance and autonomous navigation',
          departments: ['Embedded', 'AI', 'Mechanical'],
          tasks: [
            { name: 'Hardware Design', department: 'Embedded', description: 'Design PCB and circuit layout', status: 'todo' },
            { name: 'Motor Control', department: 'Embedded', description: 'Develop motor control system', status: 'todo' },
            { name: 'AI Navigation', department: 'AI', description: 'Implement obstacle avoidance algorithm', status: 'todo' },
            { name: 'Chassis Design', department: 'Mechanical', description: 'Design and 3D print car chassis', status: 'todo' }
          ]
        },
        'ai-bot': {
          name: 'AI Assistant Bot',
          description: 'Intelligent chatbot with natural language processing',
          departments: ['AI', 'Flutter'],
          tasks: [
            { name: 'Data Collection', department: 'AI', description: 'Collect and preprocess training data', status: 'todo' },
            { name: 'Model Training', department: 'AI', description: 'Train NLP model', status: 'todo' },
            { name: 'UI Development', department: 'Flutter', description: 'Develop mobile application interface', status: 'todo' }
          ]
        },
        'mech-kit': {
          name: 'Educational Mechanical Kit',
          description: 'Modular mechanical kit for STEM education',
          departments: ['Mechanical', 'Visual/Graphic'],
          tasks: [
            { name: '3D Design', department: 'Mechanical', description: 'Design mechanical components', status: 'todo' },
            { name: 'Prototyping', department: 'Mechanical', description: 'Create physical prototypes', status: 'todo' },
            { name: 'Packaging Design', department: 'Visual/Graphic', description: 'Design product packaging', status: 'todo' }
          ]
        },
        'smart-home': {
          name: 'Smart Home System',
          description: 'IoT-based home automation system',
          departments: ['Embedded', 'Flutter', 'AI'],
          tasks: [
            { name: 'Hardware Design', department: 'Embedded', description: 'Design IoT sensor nodes', status: 'todo' },
            { name: 'Mobile App', department: 'Flutter', description: 'Develop control application', status: 'todo' },
            { name: 'AI Features', department: 'AI', description: 'Implement smart scheduling', status: 'todo' }
          ]
        }
      };
      
      const template = templates[templateType];
      if (template) {
        document.getElementById('projectName').value = template.name;
        document.getElementById('projectDescription').value = template.description;
        
        // Select departments
        selectedDepartments = new Set(template.departments);
        document.querySelectorAll('#departmentsContainer input').forEach(checkbox => {
          checkbox.checked = selectedDepartments.has(checkbox.value);
        });
        
        // Load tasks
        const tasksContainer = document.getElementById('tasksContainer');
        if (tasksContainer) {
          tasksContainer.innerHTML = '';
          taskCounter = 0;
          
          template.tasks.forEach((task, index) => {
            taskCounter++;
            const taskItem = document.createElement('div');
            taskItem.className = 'task-item';
            taskItem.innerHTML = `
              <div class="task-header">
                <div class="task-number">Task ${taskCounter}</div>
                ${index > 0 ? '<button class="remove-task-btn">Remove</button>' : ''}
              </div>
              <div class="form-group">
                <label>Task Name *</label>
                <input type="text" class="task-name" value="${task.name}">
              </div>
              <div class="form-group">
                <label>Task Description</label>
                <textarea class="task-description" rows="2">${task.description}</textarea>
              </div>
              <div class="form-group">
                <label>Department</label>
                <select class="task-department">
                  <option value="">Select Department</option>
                </select>
              </div>
              <div class="form-group">
                <label>Task Deadline</label>
                <input type="date" class="task-deadline">

              <div class="form-group">
                <label>Status</label>
                <div class="trello-status">

                  <div class="status-option status-review" data-status="review">👀 Review</div>
                  <div class="status-option status-blocked" data-status="blocked">🚫 Blocked</div>
                  <div class="status-option status-done" data-status="done">✅ Done</div>
                </div>
                <input type="hidden" class="task-status" value="${task.status}">

              <div class="form-group">
                <label>Attachments</label>
                <div class="attachment-buttons">

                  <button type="button" class="attachment-btn" data-type="video">🎥 Video</button>
                  <button type="button" class="attachment-btn" data-type="document">📄 Document</button>
                </div>
                <div class="attachments-list"></div>
              </div>
            `;
            tasksContainer.appendChild(taskItem);
            setupTaskEventListeners(taskItem);
          });
          
          updateTaskDepartmentOptions();
          
          // Set department and status for each task
          setTimeout(() => {
            template.tasks.forEach((task, index) => {
              const departmentSelects = document.querySelectorAll('.task-department');
              const statusInputs = document.querySelectorAll('.task-status');
              
              if (departmentSelects[index]) {
                departmentSelects[index].value = task.department;
              }
              
              if (statusInputs[index]) {
                statusInputs[index].value = task.status;
                // Select the corresponding status option
                const taskItem = departmentSelects[index].closest('.task-item');
                const statusOption = taskItem.querySelector(`[data-status="${task.status}"]`);
                if (statusOption) {
                  selectStatus(statusOption);
                }
              }
            });
          }, 100);
        }
      }
    }
    
    function previewProject() {
      const projectName = document.getElementById('projectName').value;
      const description = document.getElementById('projectDescription').value;
      const deadline = document.getElementById('projectDeadline').value;
      
      if (!projectName) {
        alert('Please enter a project name!');
        return;
      }

      if (!deadline) {
        alert('Please select a project deadline!');
        return;
      }
      
      const tasks = [];
      document.querySelectorAll('.task-item').forEach(taskItem => {
        const name = taskItem.querySelector('.task-name').value;
        const description = taskItem.querySelector('.task-description').value;
        const department = taskItem.querySelector('.task-department').value;
        const taskDeadline = taskItem.querySelector('.task-deadline').value;
        const status = taskItem.querySelector('.task-status').value;
        
        if (name) {
          tasks.push({
            name: name,
            description: description,
            department: department,
            deadline: taskDeadline || deadline,
            status: status
          });
        }
      });
      
      if (tasks.length === 0) {
        alert('Please add at least one task!');
        return;
      }
      
      const previewContent = document.getElementById('previewContent');
      const previewBox = document.getElementById('previewBox');
      
      if (previewContent && previewBox) {
        previewContent.innerHTML = `
          <div class="preview-item"><strong>Project:</strong> ${projectName}</div>
          <div class="preview-item"><strong>Description:</strong> ${description || 'No description'}</div>
          <div class="preview-item"><strong>Deadline:</strong> ${deadline}</div>
          <div class="preview-item"><strong>Departments:</strong> ${Array.from(selectedDepartments).join(', ') || 'None selected'}</div>
          <div class="preview-item"><strong>Engineers:</strong> ${Array.from(selectedEngineers).length} selected</div>
          <div class="preview-item"><strong>Tasks:</strong> ${tasks.length} tasks created</div>
          <div class="preview-item"><strong>Notifications:</strong> Will be sent to selected recipients</div>
        `;
        
        previewBox.style.display = 'block';
      }
    }
    
    function createProject() {
      const projectName = document.getElementById('projectName').value;
      const description = document.getElementById('projectDescription').value;
      const deadline = document.getElementById('projectDeadline').value;
      
      if (!projectName) {
        alert('Please enter a project name!');
        return;
      }

      if (!deadline) {
        alert('Please select a project deadline!');
        return;
      }
      
      if (selectedDepartments.size === 0) {
        alert('Please select at least one department!');
        return;
      }
      
      const tasks = [];
      document.querySelectorAll('.task-item').forEach(taskItem => {
        const name = taskItem.querySelector('.task-name').value;
        const description = taskItem.querySelector('.task-description').value;
        const department = taskItem.querySelector('.task-department').value;
        const taskDeadline = taskItem.querySelector('.task-deadline').value;
        const status = taskItem.querySelector('.task-status').value;
        
        if (name && department) {
          tasks.push({
            name: name,
            description: description,
            department: department,
            deadline: taskDeadline || deadline,
            status: status
          });
        }
      });
      
      if (tasks.length === 0) {
        alert('Please add at least one valid task (with name and department)!');
        return;
      }

      // Get current user email for approval workflow
      google.script.run
        .withSuccessHandler(function(userEmail) {
          const isCTO = (userEmail === 'nemr@pyramakerz.com');
          
          const formData = {
            projectName: projectName,
            projectDescription: description,
            projectDeadline: deadline,
            departments: Array.from(selectedDepartments),
            engineers: Array.from(selectedEngineers),
            tasks: tasks,
            notifyCTO: document.getElementById('notifyCTO').checked,
            notifyManagers: document.getElementById('notifyManagers').checked,
            notifyEngineers: document.getElementById('notifyEngineers').checked,
            createdBy: userEmail,
            status: isCTO ? 'approved' : 'pending_approval'
          };
          
          google.script.run
            .withSuccessHandler(function(result) {
              if (result.success) {
                if (isCTO) {
                  const message = `✅ Project Created Successfully!\n\n` +
                                `Project: ${result.projectName}\n` +
                                `Project ID: ${result.projectId}\n` +
                                `Departments: ${result.departments.join(', ')}\n` +
                                `Tasks Created: ${result.tasksCreated}\n` +
                                `Project Deadline: ${result.projectDeadline}\n` +
                                `Assigned Engineers: ${result.assignedEngineers.length}\n\n` +
                                `Notifications sent to: ${result.notificationsSent} people`;
                  alert(message);
                } else {
                  const message = `📋 Project Submitted for Approval!\n\n` +
                                `Project: ${result.projectName}\n` +
                                `Your project has been sent to CTO for review.\n` +
                                `You will be notified once it's approved.`;
                  alert(message);
                }
                google.script.host.close();
              } else {
                alert('❌ Error: ' + result.error);
              }
            })
            .withFailureHandler(function(error) {
              alert('❌ Error creating project: ' + error.toString());
            })
            .createCTOProjectWithDeadlines(formData);
        })
        .withFailureHandler(function(error) {
          alert('❌ Error getting user information: ' + error.toString());
        })
        .getCurrentUserEmail();
    }
  </script>
